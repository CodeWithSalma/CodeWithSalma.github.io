site_name: Salma's Tech Journey
site_description: Personal portfolio showcasing projects, certifications, and professional journey.
site_author: Salma
copyright: Copyright &copy; 2026 Salma Pratiwi

extra_css:
  - stylesheets/extra.css

theme: 
  name: material
  icon:
    annotation: material/arrow-right-circle-outline
    logo: material/flower
    menu: material/flower
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotation
    - content.code.copy
    - navigation.tracking
    - navigation.path
    - navigation.tabs.sticky
    - navigation.footer
    - tabs: true
    ### If page want to be divided to 3 parts then uncomment toc.follow, either using toc.integrate
    # - toc.integrate 
    - toc.follow 
  language: en
  palette:
  # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: pink
      accent: purple
  # Palette toggle for dark mode    
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: indigo
      accent: deep purple
  font: 
    text: Roboto
    code: Roboto Mono

extra:
  social:
  - icon: fontawesome/brands/github-alt
    link: https://github.com/CodeWithSalma
  - icon: fontawesome/brands/google
    link: mailto:salmapratiwi32@gmail.com
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/in/salma-pratiwi
  - icon: fontawesome/brands/instagram
    link: https://www.instagram.com/salma_prtw

nav:
  - Home: index.md
  - Projects:
      - Projects Overview: projects/index.md
      # - QA & Test Automation: projects/qa/index.md
      - RPA & Automation: 
        - UiPath Invoice Processing Automation: projects/rpa/uipath.md
        - Vendor Invoice Management Portal: projects/rpa/vendor.md
      - DevOps & Infrastructure: 
        - Local DevOps Homelab: projects/devops/localdevops.md
      - Other Projects: 
        - BCA Associated Projects: projects/others/bca.md
        - Documentation with Mkdocs: projects/others/mkdocs.md
  - Certifications: certifications/index.md
  - About: about/index.md

# Extensions  
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - footnotes
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - pymdownx.tabbed:
        alternate_style: true
  - pymdownx.superfences: 
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - autorefs
  - git-revision-date-localized
  - glightbox